<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Rà Soát Đối Thủ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --red:#d71920; --navy:#1a3c6e; --gold:#ffc107; --green:#1e8e4e; --bg:#f4f6fb;
    --card:#fff; --line:#e5e9f2; --txt:#1c2434; --mut:#6b7280; }
  *{box-sizing:border-box; margin:0; padding:0}
  body{font-family:'Be Vietnam Pro',system-ui,sans-serif; background:var(--bg); color:var(--txt);
    min-height:100vh; padding:16px; -webkit-font-smoothing:antialiased}
  .wrap{max-width:920px; margin:0 auto}
  .head{background:linear-gradient(135deg,var(--navy),#2c4a8a); color:#fff; border-radius:16px;
    padding:20px; box-shadow:0 8px 24px rgba(26,60,110,.18)}
  .head h1{font-size:20px; font-weight:800} .head p{font-size:13px; opacity:.85; margin-top:5px}
  .card{background:var(--card); border-radius:14px; padding:18px; margin-top:14px;
    border:1px solid var(--line); box-shadow:0 2px 10px rgba(20,30,60,.06)}
  .card h2{font-size:15px; font-weight:700; color:var(--navy); margin-bottom:12px}
  .kpis{display:grid; grid-template-columns:repeat(5,1fr); gap:10px}
  .kpi{background:#f6f8fc; border:1px solid var(--line); border-radius:12px; padding:12px 8px; text-align:center}
  @media (max-width:600px){.kpis{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}}
  .kpi .n{font-size:26px; font-weight:800; line-height:1} .kpi .l{font-size:11.5px; color:var(--mut); margin-top:6px}
  .kpi.red .n{color:var(--red)} .kpi.green .n{color:var(--green)} .kpi.navy .n{color:var(--navy)}
  .bar-wrap{height:10px; background:#e9edf5; border-radius:8px; overflow:hidden; margin-top:12px}
  .bar-wrap i{display:block; height:100%; background:linear-gradient(90deg,var(--green),#37b26c); border-radius:8px; transition:width .4s}
  .cas{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:4px}
  .cas label{font-size:11.5px; font-weight:600; color:var(--mut); display:block; margin-bottom:4px}
  .cas select,.filters input{padding:11px 13px; border:1.5px solid var(--line); border-radius:10px;
    font-family:inherit; font-size:14px; background:#fafbfd; outline:none; width:100%}
  .filters{margin-top:10px}
  .tbl-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch; max-width:100%; -webkit-overflow-scrolling:touch}
  table{width:auto; min-width:100%; border-collapse:collapse; margin-top:8px; font-size:11.5px; white-space:nowrap; table-layout:auto}
  th,td{padding:6px 7px; text-align:left; border-bottom:1px solid var(--line)}
  th{background:#f6f8fc; color:var(--mut); font-size:10px; font-weight:700; white-space:normal; word-wrap:break-word; vertical-align:top}
  td{font-size:11.5px; max-width:160px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  td.num{font-weight:700}
  .tag{display:inline-block; padding:2px 8px; border-radius:16px; font-size:10px; font-weight:700}
  .tag.ok{background:#e6f6ec; color:var(--green)} .tag.warn{background:#fdeeee; color:var(--red)}
  .hdr-acts{float:right; display:flex; gap:6px}
  .hdr-btn{background:rgba(255,255,255,.16); color:#fff; border:none; border-radius:16px;
    padding:5px 11px; font-size:11.5px; font-weight:600; font-family:inherit; cursor:pointer; white-space:nowrap}
  .hdr-btn:hover{background:rgba(255,255,255,.26)}
  .foot{text-align:center; color:var(--mut); font-size:11px; margin-top:16px}
  .grow{cursor:pointer; user-select:none}
  .grow .ar{display:inline-block; width:14px; font-size:11px; transition:.2s}
  .grow .ar.open{transform:rotate(90deg)}
  .tab-btn{background:none;border:1.5px solid var(--line);border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600;font-family:inherit;color:var(--mut);cursor:pointer;transition:.15s}
  .tab-btn.active{background:var(--navy);color:#fff;border-color:var(--navy)}
  .sort-arrow{font-size:10px;margin-left:3px;opacity:.4}
  .sort-arrow.on{opacity:1;color:var(--navy)}
  th.sortable{cursor:pointer;user-select:none}
  th.sortable:hover{color:var(--navy)}
  .gdv-row{display:flex; align-items:center; padding:8px 0; border-bottom:1px solid var(--line)}
  .gdv-table{width:100%;table-layout:fixed;border-collapse:collapse;margin-top:4px;font-size:11px}
  .gdv-table col.col-gdv{width:17%}.gdv-table col.col-num{width:6%}
  .gdv-table col.col-bar{width:11%}.gdv-table col.col-pct{width:5%}
  .gdv-table col.col-doi{width:7%}.gdv-table col.col-delta{width:7%}
  .gdv-table col.col-miss{width:7%}
  .delta-pos{color:var(--green);font-weight:700}
  .delta-neg{color:var(--red);font-weight:700}
  .delta-zero{color:var(--mut)}
  .miss-warn{color:var(--red);font-weight:600}
  .miss-ok{color:var(--green)}
  .gdv-table th{background:#f6f8fc;color:var(--mut);font-size:10.5px;font-weight:700;padding:8px 6px;text-align:center;border-bottom:2px solid var(--line);white-space:nowrap}
  .gdv-table th.col-gdv{text-align:left}
  .gdv-table td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gdv-table td.col-gdv{text-align:left;font-weight:600}
  .gdv-table .bar-cell{padding:7px 6px;vertical-align:middle}
  .gdv-table .bar-cell i{display:block;height:7px;background:linear-gradient(90deg,var(--green),#37b26c);border-radius:5px}
  .gdv-table .qlkv-name{font-weight:500;font-size:12px;padding-left:22px}
  .gdv-sub{display:none}
  .week-select{display:inline-flex;align-items:center;gap:8px;margin-left:8px}
  .week-select select{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.3);
    border-radius:8px;padding:5px 10px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;outline:none}
  .week-select select option{color:var(--txt);background:#fff}
  .empty{text-align:center; color:var(--mut); padding:24px 0; font-size:13.5px}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;
    z-index:999; padding:14px}
  .modal{background:#fff;border-radius:14px;padding:18px;max-width:600px;width:100%;box-shadow:0 16px 40px rgba(0,0,0,.2)}
  .modal h3{font-size:15px;font-weight:800;margin-bottom:12px;color:var(--navy)}
  .btn2{flex:1;border:none;border-radius:10px;padding:11px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer}
  .btn2.ghost{background:#f0f2f7;color:var(--txt)}
  .loading{text-align:center;padding:40px;color:var(--mut)}
  .loading::after{content:'...';animation:dots 1.5s steps(4,end) infinite}
  @keyframes dots{0%{content:'.'}33%{content:'..'}66%{content:'...'}}
  .store-link{color:var(--navy);text-decoration:none;font-weight:600}
  .store-link:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="hdr-acts">
      <button class="hdr-btn" onclick="refreshData()" title="Đồng bộ dữ liệu mới nhất">🔄 Tải lại</button>
      <button class="hdr-btn" onclick="exportDetail()">📥 Xuất chi tiết</button>
      <button class="hdr-btn" onclick="exportMissing()">📤 Chưa KS</button>
    </div>
    <h1>📊 Tiến độ Rà Soát Đối Thủ
      <span class="week-select">
        <select id="selWeek" onchange="onWeekChange()"><option value="">Đang tải...</option></select>
      </span>
    </h1>
    <p>cập nhật: <span id="updated">--</span> · <b id="verTag">v2.2</b></p>
  </div>
  <div class="card">
    <h2>📈 Tổng quan — <span id="weekLabel">Tuần hiện tại</span></h2>
    <div class="kpis">
      <div class="kpi"><div class="n" id="kTotal">—</div><div class="l">CH cần KS</div></div>
      <div class="kpi green"><div class="n" id="kDone">—</div><div class="l">Đã KS tuần này</div></div>
      <div class="kpi navy"><div class="n" id="kPct">—</div><div class="l">Tỷ lệ hoàn thành</div></div>
      <div class="kpi red"><div class="n" id="kMissing">—</div><div class="l">Chưa khảo sát</div></div>
      <div class="kpi"><div class="n" id="kDoiThu">—</div><div class="l">Đối thủ đang theo dõi</div></div>
    </div>
    <div class="bar-wrap"><i id="barFill" style="width:0%"></i></div>
  </div>
  <div class="card">
    <h2 style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <span>📋</span>
      <button class="tab-btn active" id="tabGdv" onclick="switchTab('gdv')">Theo GĐV</button>
      <button class="tab-btn" id="tabTopQlkv" onclick="switchTab('topQlkv')">Top 20 QLKV</button>
      <button class="tab-btn" id="tabLoaiDT" onclick="switchTab('loaiDT')">Loại ĐT</button>
    </h2>
    <div id="gdvSection">Đang tải...</div>
    <div id="topQlkvSection" style="display:none">Đang tải...</div>
    <div id="loaiDTSection" style="display:none">Đang tải...</div>
  </div>
  <div class="card">
    <h2>🎯 Lọc địa bàn</h2>
    <div class="cas">
      <div><label>Miền</label><select id="selMien" onchange="onFilterChange('mien')"><option value="">— Tất cả Miền —</option></select></div>
      <div><label>Vùng (GĐV)</label><select id="selVung" onchange="onFilterChange('vung')"><option value="">— Tất cả GĐV —</option></select></div>
      <div><label>QLKV</label><select id="selQlkv" onchange="onFilterChange('qlkv')"><option value="">— Tất cả QLKV —</option></select></div>
    </div>
    <div class="filters">
      <input id="fSearch" placeholder="Tìm mã SAP / tên CH..." oninput="showAllDetail=false;renderTable()">
    </div>
  </div>
  <div class="card">
    <h2>📋 Danh sách khảo sát <span id="rowCount" style="color:var(--mut);font-weight:500"></span></h2>
    <div id="tableWrap"><div class="loading">Đang tải dữ liệu</div></div>
  </div>
  <div class="foot">Dashboard · Rà Soát Đối Thủ <span style="color:var(--mut)">v3.0</span></div>
</div>

<script>
const SHEET_ID = '1UMtB9MOxGOaZvxN5VAUGAS1bPaAL2tVVFEViGANd4Tk';
const STORE_GID = '164583655';
const DOI_THU_GID = '320821145';
const TRACKLOG_GID = '545054306';
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwhPoI7RroB-c0HJZGw3mgcO5J55rO8pLl9vL6pSJJKevg-O6QLFtj5xj9cqMSui2Cm/exec';
const GV = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:csv';

let STORES = [], ROWS = [], ALL_ROWS = [], TRACK_DATA = [];
let CURRENT_WEEK = null;
let WEEKS = [];
let showAllDetail = false;

const $ = id => document.getElementById(id);
const esc = s => (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const distinct = a => [...new Set(a)].sort((x,y)=>String(x).localeCompare(String(y),'vi'));

function isoWeek(d) {
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = date.getUTCDay() || 7;
  date.setUTCDate(date.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
  return Math.ceil((((date - yearStart) / 86400000) + 1) / 7);
}

function parseDate(s) {
  if (!s) return null;
  // format: "DD/MM/YYYY HH:MM" or "DD/MM/YYYY" or ISO
  const m = String(s).match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (m) return new Date(+m[3], +m[2] - 1, +m[1]);
  return new Date(s);
}

async function fetchCSV(gid) {
  const url = GV + '&gid=' + gid;
  const resp = await fetch(url, { cache:'no-store' });
  if (!resp.ok) throw new Error('Không tải được sheet ' + gid + ' (HTTP ' + resp.status + ')');
  const text = await resp.text();
  return parseCSV(text);
}

function rowsToObjects(rows) {
  // rows = 2D array [header, ...data] → array of {col: value}
  if (!rows || rows.length < 2) return [];
  const headers = (rows[0] || []).map(h => String(h == null ? '' : h).trim());
  const out = [];
  for (let i = 1; i < rows.length; i++) {
    const r = rows[i] || [];
    if (!r.length || r.every(v => !v)) continue;
    const obj = {};
    headers.forEach((h, j) => { obj[h] = (r[j] == null ? '' : String(r[j])); });
    out.push(obj);
  }
  return out;
}

async function fetchGASData() {
  const resp = await fetch(GAS_URL + '?action=data', {cache: 'no-store'});
  const j = await resp.json();
  return j;
}

function parseCSV(text) {
  const rows = [];
  const lines = text.split('\n');
  if (lines.length < 2) return rows;
  const headers = lines[0].split(',').map(h => h.replace(/^"|"$/g, '').trim());
  for (let i = 1; i < lines.length; i++) {
    const vals = parseCSVLine(lines[i]);
    if (!vals.length || vals.every(v => !v)) continue;
    const obj = {};
    headers.forEach((h, j) => { obj[h] = vals[j] || ''; });
    rows.push(obj);
  }
  return rows;
}

function parseCSVLine(line) {
  const result = [];
  let current = '', inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (inQuotes) {
      if (ch === '"') {
        if (i + 1 < line.length && line[i + 1] === '"') { current += '"'; i++; }
        else inQuotes = false;
      } else current += ch;
    } else {
      if (ch === '"') inQuotes = true;
      else if (ch === ',') { result.push(current); current = ''; }
      else current += ch;
    }
  }
  result.push(current);
  return result;
}

async function loadAll() {
  try {
    // Đọc trực tiếp 3 sheet CSV song song. Tránh chạy GAS doGet để tuần tự
    // tải/serialize cả main và log trong mỗi lần mở dashboard.
    const [storeData, doiThuData, trackData] = await Promise.all([
      fetchCSV(STORE_GID),
      fetchCSV(DOI_THU_GID),
      fetchCSV(TRACKLOG_GID)
    ]);

    // Process stores
    STORES = storeData.filter(r => {
      const tt = (r['Tình Trạng'] || '').trim().toLowerCase();
      return tt === 'đang hoạt động';
    }).map(r => ({
      sap: String(r['Mã SAP'] || '').trim(),
      ten: (r['Tên cửa hàng'] || '').trim(),
      mien: (r['Miền'] || '').trim(),
      tinh: (r['Tỉnh/TP'] || '').trim(),
      huyen: (r['Quận/huyện'] || '').trim(),
      qlkv: (r['QLKV'] || '').trim(),
      gdv: (r['GĐV'] || '').trim(),
      khaiTruong: (r['Khai Trương'] || '').trim()
    }));

    // Process competitor survey data
    ALL_ROWS = doiThuData.map(r => {
      const tuanRaw = (r['Tuần'] || '').trim();
      let tuan = tuanRaw ? parseInt(tuanRaw, 10) : 0;
      const ngaySua = (r['Ngày sửa'] || '').trim();
      if (!tuan && ngaySua) {
        const d = parseDate(ngaySua);
        if (d && !isNaN(d)) tuan = isoWeek(d);
      }
      return {
        tuan: tuan || 0,
        ngaySua: ngaySua,
        mien: (r['Miền'] || '').trim(),
        gdv: (r['GĐV'] || '').trim(),
        qlkv: (r['QLKV'] || '').trim(),
        sap: String(r['Mã CH'] || '').trim(),
        tenCH: (r['Tên CH'] || '').trim(),
        tinh: (r['Tỉnh/TP'] || '').trim(),
        huyen: (r['Quận/Huyện'] || '').trim(),
        nhomDT: (r['Nhóm đối thủ'] || '').trim(),
        tenDT: (r['Tên đối thủ'] || '').trim(),
        diaChi: (r['Địa chỉ'] || '').trim(),
        lat: (r['Vĩ độ'] || '').trim(),
        lng: (r['Kinh độ'] || '').trim(),
        kc: (r['KC (km)'] || '').trim(),
        ngayKT: (r['Ngày khai trương'] || '').trim(),
        doanhSo: (r['Doanh số TB/ngày (trđ)'] || '').trim(),
        luongKhach: (r['Khách TB/ngày'] || '').trim(),
        mt: (r['MT (m)'] || '').trim(),
        giaThue: (r['Giá thuê (tr/th)'] || '').trim(),
        dienTich: (r['Diện tích (m²)'] || '').trim(),
        maDT: (r['Mã ĐT'] || '').trim(),
        ngayKhaiBao: (r['Ngày khai báo'] || '').trim(),
        ngayUpdate: (r['Ngày update'] || '').trim()
      };
    });

    // Process tracklog data
    TRACK_DATA = trackData.map(r => ({
      tuan: parseInt((r['Tuần']||'').trim(), 10) || 0,
      ma_ch: String(r['Mã CH']||'').trim(),
      action: (r['Hành động']||'').trim(),
      soDoiThu: parseInt((r['Số đối thủ']||'').trim(), 10) || 0
    })).filter(r => r.ma_ch && r.tuan);

    // Build week list from tracklogs
    const weekSet = new Set();
    TRACK_DATA.forEach(r => { if (r.tuan > 0) weekSet.add(r.tuan); });
    WEEKS = [...weekSet].sort((a, b) => b - a);

    // Set current week
    const now = new Date();
    const thisWeek = isoWeek(now);
    CURRENT_WEEK = WEEKS.includes(thisWeek) ? thisWeek : (WEEKS[0] || thisWeek);

    // Build week selector
    buildWeekSelector();
    buildFilters();
    render();

    $('updated').textContent = new Date().toLocaleString('vi-VN');
    $('verTag').textContent = 'v3.0 · ' + ALL_ROWS.length + ' phiếu · ' + STORES.length + ' CH';
  } catch (e) {
    $('tableWrap').innerHTML = '<div class="empty" style="color:var(--red)">Lỗi tải dữ liệu: ' + esc(e.message) + '<br><button class="hdr-btn" style="color:var(--navy);background:#eef3fb;margin-top:10px" onclick="loadAll()">Thử lại</button></div>';
  }
}

function buildWeekSelector() {
  const sel = $('selWeek');
  let html = '';
  WEEKS.forEach(w => {
    // Compute date range for this week
    const mon = mondayOfWeek(w);
    const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
    const fmt = d => d.getDate() + '/' + (d.getMonth() + 1);
    const label = 'Tuần ' + w + ' (' + fmt(mon) + '–' + fmt(sun) + ')';
    const sel = w === CURRENT_WEEK ? ' selected' : '';
    html += '<option value="' + w + '"' + sel + '>' + label + '</option>';
  });
  // Add "all" option
  html += '<option value="0">📋 Tất cả các tuần</option>';
  sel.innerHTML = html;
  sel.value = String(CURRENT_WEEK);

  // Update week label
  const mon = mondayOfWeek(CURRENT_WEEK);
  const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
  $('weekLabel').textContent = 'Tuần ' + CURRENT_WEEK + ' · ' + mon.getDate() + '/' + (mon.getMonth()+1) + ' – ' + sun.getDate() + '/' + (sun.getMonth()+1);
}

function mondayOfWeek(w) {
  // ISO week → Monday date
  const jan4 = new Date(new Date().getFullYear(), 0, 4);
  const jan4Day = jan4.getDay() || 7;
  const firstMonday = new Date(jan4);
  firstMonday.setDate(jan4.getDate() - (jan4Day - 1));
  const d = new Date(firstMonday);
  d.setDate(firstMonday.getDate() + (w - 1) * 7);
  return d;
}

function onWeekChange() {
  CURRENT_WEEK = parseInt($('selWeek').value, 10) || 0;
  if (CURRENT_WEEK > 0) {
    const mon = mondayOfWeek(CURRENT_WEEK);
    const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
    $('weekLabel').textContent = 'Tuần ' + CURRENT_WEEK + ' · ' + mon.getDate() + '/' + (mon.getMonth()+1) + ' – ' + sun.getDate() + '/' + (sun.getMonth()+1);
  } else {
    $('weekLabel').textContent = 'Tất cả các tuần';
  }
  render();
}

function getFilteredRows() {
  // Main sheet là hiện trạng (không có Tuần) → trả toàn bộ
  return ALL_ROWS;
}

function buildFilters() {
  const miens = distinct(STORES.map(s => s.mien).filter(Boolean));
  $('selMien').innerHTML = '<option value="">— Tất cả Miền —</option>' + miens.map(m => '<option value="' + esc(m) + '">' + esc(m) + '</option>').join('');
  buildGdvFilter();
}

function buildGdvFilter() {
  const m = $('selMien').value;
  const gdvs = distinct(STORES.filter(s => !m || s.mien === m).map(s => s.gdv).filter(Boolean));
  $('selVung').innerHTML = '<option value="">— Tất cả GĐV —</option>' + gdvs.map(g => '<option value="' + esc(g) + '">' + esc(g) + '</option>').join('');
  buildQlkvFilter();
}

function buildQlkvFilter() {
  const m = $('selMien').value, v = $('selVung').value;
  const qs = distinct(STORES.filter(s => (!m || s.mien === m) && (!v || s.gdv === v)).map(s => s.qlkv).filter(Boolean));
  $('selQlkv').innerHTML = '<option value="">— Tất cả QLKV —</option>' + qs.map(q => '<option value="' + esc(q) + '">' + esc(q) + '</option>').join('');
}

function onFilterChange(level) {
  if (level === 'mien') { buildGdvFilter(); }
  else if (level === 'vung') { buildQlkvFilter(); }
  render();
}

function scopeStores() {
  const m = $('selMien').value, v = $('selVung').value, q = $('selQlkv').value;
  return STORES.filter(s => (!m || s.mien === m) && (!v || s.gdv === v) && (!q || s.qlkv === q));
}

function getDoneSapsForWeek(week) {
  const s = new Set();
  TRACK_DATA.forEach(r => { if (r.tuan === week) s.add(r.ma_ch); });
  return s;
}

function render() {
  ROWS = getFilteredRows();
  const sInScope = scopeStores();
  const scopeSaps = new Set(sInScope.map(s => s.sap));

  // Done: CH in scope có bản ghi Tracklog trong tuần đang chọn
  const doneSaps = getDoneSapsForWeek(CURRENT_WEEK);
  // Chỉ giữ CH nằm trong scope
  [...doneSaps].forEach(sap => { if (!scopeSaps.has(sap)) doneSaps.delete(sap); });

  const total = scopeSaps.size;
  const done = doneSaps.size;
  const missing = total - done;
  const pct = total ? Math.round(done / total * 100) : 0;
  // Cumulative: count all competitor rows (all time) for stores in scope
  const doiThuTotal = ALL_ROWS.filter(r => scopeSaps.has(r.sap)).length;

  $('kTotal').textContent = total || '—';
  $('kDone').textContent = done;
  $('kPct').textContent = pct + '%';
  $('kMissing').textContent = missing;
  $('kDoiThu').textContent = doiThuTotal;
  $('barFill').style.width = Math.min(100, pct) + '%';

  buildGdvSection();
  buildTopQlkv();
  showAllDetail = false;
  renderTable();
}

// --- Sort state ---
let SORT_G = {col: 'pct', asc: true}, SORT_T = {col: 'pct', asc: true}, SORT_L = {col: 'cnt', asc: false};

function sortArrow(col, st) {
  if (st.col !== col) return '';
  return st.asc ? ' ▲' : ' ▼';
}

function thSort(col, st, label) {
  const arrow = sortArrow(col, st);
  return '<th class="sortable col-' + col + '" onclick="sortBy(\'' + col + '\',\'' + (st === SORT_G ? 'G' : st === SORT_T ? 'T' : 'L') + '\')">' + label + '<span class="sort-arrow' + (arrow ? ' on' : '') + '">' + (arrow || ' ↕') + '</span></th>';
}

function computeGdvData() {
  const sInScope = scopeStores();
  const scopeSaps = new Set(sInScope.map(s => s.sap));

  // --- Done tuần hiện tại (từ Tracklogs) ---
  const doneSaps = getDoneSapsForWeek(CURRENT_WEEK);
  [...doneSaps].forEach(sap => { if (!scopeSaps.has(sap)) doneSaps.delete(sap); });

  // --- Số đối thủ tuần hiện tại (từ Tracklogs "Số đối thủ") ---
  const doiCurBySap = {};
  TRACK_DATA.forEach(r => {
    if (r.tuan === CURRENT_WEEK && scopeSaps.has(r.ma_ch)) {
      doiCurBySap[r.ma_ch] = (doiCurBySap[r.ma_ch] || 0) + r.soDoiThu;
    }
  });

  // --- Thiếu thông tin (từ sheet hiện trạng) ---
  const missKTBySap = {};
  const missInfoBySap = {};
  ALL_ROWS.forEach(r => {
    if (scopeSaps.has(r.sap)) {
      if (!r.ngayKT) missKTBySap[r.sap] = true;
      if (!r.doanhSo || !r.luongKhach || !r.mt || !r.giaThue || !r.dienTich) {
        missInfoBySap[r.sap] = true;
      }
    }
  });

  // --- Tuần trước (W-1) ---
  const prevWeek = CURRENT_WEEK - 1;
  const prevDoneSaps = getDoneSapsForWeek(prevWeek);
  const doiPrevBySap = {};
  TRACK_DATA.forEach(r => {
    if (r.tuan === prevWeek && scopeSaps.has(r.ma_ch)) {
      doiPrevBySap[r.ma_ch] = (doiPrevBySap[r.ma_ch] || 0) + r.soDoiThu;
    }
  });

  const gdvMap = {};
  sInScope.forEach(s => {
    if (!gdvMap[s.gdv]) {
      gdvMap[s.gdv] = { gdv: s.gdv, mien: s.mien || '', t: 0, d: 0, pct: 0, doi: 0, doiPrev: 0, delta: 0, missKT: 0, missInfo: 0, qlkvs: {} };
    }
    gdvMap[s.gdv].t++;
    if (doneSaps.has(s.sap)) {
      gdvMap[s.gdv].d++;
      gdvMap[s.gdv].doi += (doiCurBySap[s.sap] || 0);
    }
    if (prevDoneSaps.has(s.sap)) {
      gdvMap[s.gdv].doiPrev += (doiPrevBySap[s.sap] || 0);
    }
    if (missKTBySap[s.sap]) gdvMap[s.gdv].missKT++;
    if (missInfoBySap[s.sap]) gdvMap[s.gdv].missInfo++;
  });

  // Build QLKV sub-data
  const gdvs = [];
  Object.values(gdvMap).forEach(g => {
    g.pct = g.t ? Math.round(g.d / g.t * 100) : 0;
    g.delta = g.doi - g.doiPrev;
    const qlkvMap = {};
    sInScope.filter(s => s.gdv === g.gdv).forEach(s => {
      if (!qlkvMap[s.qlkv]) {
        qlkvMap[s.qlkv] = { qlkv: s.qlkv, t: 0, d: 0, pct: 0, doi: 0, doiPrev: 0, delta: 0, missKT: 0, missInfo: 0 };
      }
      qlkvMap[s.qlkv].t++;
      if (doneSaps.has(s.sap)) {
        qlkvMap[s.qlkv].d++;
        qlkvMap[s.qlkv].doi += (doiCurBySap[s.sap] || 0);
      }
      if (prevDoneSaps.has(s.sap)) {
        qlkvMap[s.qlkv].doiPrev += (doiPrevBySap[s.sap] || 0);
      }
      if (missKTBySap[s.sap]) qlkvMap[s.qlkv].missKT++;
      if (missInfoBySap[s.sap]) qlkvMap[s.qlkv].missInfo++;
    });
    g.qlkvs = Object.values(qlkvMap).map(q => {
      q.pct = q.t ? Math.round(q.d / q.t * 100) : 0;
      q.delta = q.doi - q.doiPrev;
      return q;
    }).sort((a, b) => String(a.qlkv).localeCompare(String(b.qlkv), 'vi'));
    gdvs.push(g);
  });
  return gdvs;
}

const SORT_FNS = {
  gdv: (a, b) => String(a.gdv).localeCompare(String(b.gdv), 'vi'),
  t: (a, b) => a.t - b.t,
  d: (a, b) => a.d - b.d,
  pct: (a, b) => a.pct - b.pct,
  doi: (a, b) => a.doi - b.doi,
  delta: (a, b) => a.delta - b.delta,
  missKT: (a, b) => a.missKT - b.missKT,
  missInfo: (a, b) => a.missInfo - b.missInfo,
  cnt: (a, b) => a.cnt - b.cnt,
  ch: (a, b) => a.ch - b.ch,
  name: (a, b) => String(a.name).localeCompare(String(b.name), 'vi')
};

function sortBy(col, which) {
  const st = which === 'G' ? SORT_G : which === 'T' ? SORT_T : SORT_L;
  if (st.col === col) st.asc = !st.asc;
  else { st.col = col; st.asc = (col === 'pct'); }
  if (which === 'G') buildGdvSection();
  else if (which === 'T') buildTopQlkv();
  else buildLoaiDT();
}

function buildGdvSection() {
  const gdvs = computeGdvData();
  if (!gdvs.length) { $('gdvSection').innerHTML = '<div class="empty">Chưa có dữ liệu</div>'; return; }
  const sf = SORT_FNS[SORT_G.col] || SORT_FNS.pct;

  // Group GĐV by Miền
  const byMien = {};
  gdvs.forEach(g => {
    const m = g.mien || 'Khác';
    if (!byMien[m]) byMien[m] = [];
    byMien[m].push(g);
  });
  // Sort each miền's GĐVs
  const mienOrder = ['Miền Bắc', 'Miền Trung', 'Miền Nam'];
  Object.values(byMien).forEach(arr => arr.sort((a, b) => { const v = sf(a, b); return SORT_G.asc ? v : -v; }));

  function deltaHtml(d) {
    if (d > 0) return '<span class="delta-pos">+' + d + '</span>';
    if (d < 0) return '<span class="delta-neg">' + d + '</span>';
    return '<span class="delta-zero">0</span>';
  }
  function missHtml(n) {
    if (n > 0) return '<span class="miss-warn">' + n + '</span>';
    return '<span class="miss-ok">0</span>';
  }

  const cols = '<colgroup><col class="col-gdv"><col class="col-num"><col class="col-num"><col class="col-bar"><col class="col-pct"><col class="col-doi"><col class="col-delta"><col class="col-miss"><col class="col-miss"></colgroup>';

  // Single shared table with header — all miền inside, columns aligned
  let html = '<table class="gdv-table">' + cols;
  html += '<thead><tr>';
  html += thSort('gdv', SORT_G, 'GĐV')
    + thSort('t', SORT_G, 'CH KS')
    + thSort('d', SORT_G, 'Đã làm')
    + '<th class="bar-cell col-bar">Tỷ lệ</th>'
    + thSort('pct', SORT_G, '%')
    + thSort('doi', SORT_G, 'Đối thủ')
    + thSort('delta', SORT_G, '+/- W-1')
    + thSort('missKT', SORT_G, 'Thiếu KT')
    + thSort('missInfo', SORT_G, 'Thiếu TT');
  html += '</tr></thead><tbody>';

  function renderMienBlock(mien, arr) {
    let mt = 0, md = 0, mdoi = 0, mdoiPrev = 0, mmissKT = 0, mmissInfo = 0;
    arr.forEach(g => { mt += g.t; md += g.d; mdoi += g.doi; mdoiPrev += g.doiPrev; mmissKT += g.missKT; mmissInfo += g.missInfo; });
    const mpct = mt ? Math.round(md / mt * 100) : 0;
    const emoji = mien==='Miền Bắc'?'🏔️':mien==='Miền Trung'?'🏖️':mien==='Miền Nam'?'🌴':'📍';
    let out = '<tr class="mien-hdr"><td colspan="9" style="padding:8px 12px;background:linear-gradient(135deg,var(--navy),#2d5aa0);color:white;font-weight:700;font-size:13px">';
    out += emoji + ' ' + esc(mien) + ' · ' + arr.length + ' GĐV · ' + mt + ' CH · Đã làm ' + md + ' (' + mpct + '%) · Đối thủ ' + mdoi;
    out += '</td></tr>';
    arr.forEach(g => {
      const cls = 'sub-' + g.gdv.replace(/[^a-zA-Z0-9]/g, '_');
      out += '<tr class="grow" onclick="toggleGdv(this,\'' + cls + '\')" style="cursor:pointer">';
      out += '<td class="col-gdv"><span class="ar">▶</span> ' + esc(g.gdv) + '</td>';
      out += '<td class="col-num">' + g.t + '</td>';
      out += '<td class="col-num">' + g.d + '</td>';
      out += '<td class="bar-cell col-bar"><i style="width:' + g.pct + '%"></i></td>';
      out += '<td class="col-pct">' + g.pct + '%</td>';
      out += '<td class="col-doi">' + (g.doi || '—') + '</td>';
      out += '<td class="col-delta">' + deltaHtml(g.delta) + '</td>';
      out += '<td class="col-miss">' + missHtml(g.missKT) + '</td>';
      out += '<td class="col-miss">' + missHtml(g.missInfo) + '</td></tr>';
      g.qlkvs.forEach(q => {
        out += '<tr class="gdv-sub ' + cls + '" style="display:none">';
        out += '<td class="col-gdv qlkv-name">' + esc(q.qlkv) + '</td>';
        out += '<td class="col-num">' + q.t + '</td>';
        out += '<td class="col-num">' + q.d + '</td>';
        out += '<td class="bar-cell col-bar"><i style="width:' + q.pct + '%"></i></td>';
        out += '<td class="col-pct">' + q.pct + '%</td>';
        out += '<td class="col-doi">' + (q.doi || '—') + '</td>';
        out += '<td class="col-delta">' + deltaHtml(q.delta) + '</td>';
        out += '<td class="col-miss">' + missHtml(q.missKT) + '</td>';
        out += '<td class="col-miss">' + missHtml(q.missInfo) + '</td></tr>';
      });
    });
    return out;
  }

  mienOrder.forEach(mien => {
    const arr = byMien[mien];
    if (arr && arr.length) html += renderMienBlock(mien, arr);
  });
  // Any GĐV not in known miền
  Object.keys(byMien).filter(m => !mienOrder.includes(m)).forEach(mien => {
    html += renderMienBlock(mien, byMien[mien]);
  });

  html += '</tbody></table>';
  $('gdvSection').innerHTML = html || '<div class="empty">Chưa có dữ liệu</div>';
}

function buildTopQlkv() {
  const gdvs = computeGdvData();
  const all = [];
  gdvs.forEach(g => { g.qlkvs.forEach(q => { all.push({ ...q, gdv: g.gdv }); }); });
  if (!all.length) { $('topQlkvSection').innerHTML = '<div class="empty">Chưa có dữ liệu</div>'; return; }
  const sf = SORT_FNS[SORT_T.col] || SORT_FNS.pct;
  all.sort((a, b) => { const v = sf(a, b); return SORT_T.asc ? v : -v; });
  const top = all.slice(0, 20);

  function deltaHtml(d) {
    if (d > 0) return '<span class="delta-pos">+' + d + '</span>';
    if (d < 0) return '<span class="delta-neg">' + d + '</span>';
    return '<span class="delta-zero">0</span>';
  }
  function missHtml(n) {
    if (n > 0) return '<span class="miss-warn">' + n + '</span>';
    return '<span class="miss-ok">0</span>';
  }

  const cols = '<colgroup><col style="width:14%"><col style="width:14%"><col style="width:6%"><col style="width:6%"><col style="width:11%"><col style="width:5%"><col style="width:7%"><col style="width:7%"><col style="width:7%"><col style="width:7%"></colgroup>';
  let html = '<table class="gdv-table">' + cols + '<thead><tr>';
  html += thSort('gdv', SORT_T, 'GĐV')
    + '<th class="sortable col-gdv">QLKV</th>'
    + thSort('t', SORT_T, 'CH KS')
    + thSort('d', SORT_T, 'Đã làm')
    + '<th class="bar-cell col-bar">Tỷ lệ</th>'
    + thSort('pct', SORT_T, '%')
    + thSort('doi', SORT_T, 'Đối thủ')
    + thSort('delta', SORT_T, '+/- W-1')
    + thSort('missKT', SORT_T, 'Thiếu KT')
    + thSort('missInfo', SORT_T, 'Thiếu TT');
  html += '</tr></thead><tbody>';
  top.forEach(q => {
    html += '<tr><td class="col-gdv" style="font-weight:600">' + esc(q.gdv) + '</td>';
    html += '<td class="col-gdv" style="padding-left:8px;font-weight:500">' + esc(q.qlkv) + '</td>';
    html += '<td class="col-num">' + q.t + '</td>';
    html += '<td class="col-num">' + q.d + '</td>';
    html += '<td class="bar-cell col-bar"><i style="width:' + q.pct + '%"></i></td>';
    html += '<td class="col-pct">' + q.pct + '%</td>';
    html += '<td class="col-doi">' + (q.doi || '—') + '</td>';
    html += '<td class="col-delta">' + deltaHtml(q.delta) + '</td>';
    html += '<td class="col-miss">' + missHtml(q.missKT) + '</td>';
    html += '<td class="col-miss">' + missHtml(q.missInfo) + '</td></tr>';
  });
  html += '<tr><td colspan="10" style="text-align:center;font-size:11px;color:var(--mut);padding:8px">Hiển thị ' + top.length + '/' + all.length + ' QLKV</td></tr>';
  html += '</tbody></table>';
  $('topQlkvSection').innerHTML = html;
}

function buildLoaiDT() {
  const sInScope = scopeStores();
  const scopeSaps = new Set(sInScope.map(s => s.sap));
  const totalCH = scopeSaps.size;
  const dtList = ALL_ROWS.filter(r => scopeSaps.has(r.sap) && r.nhomDT);

  const nhomMap = {};
  dtList.forEach(r => {
    const nhom = r.nhomDT;
    if (!nhomMap[nhom]) nhomMap[nhom] = { name: nhom, cnt: 0, chSet: new Set() };
    nhomMap[nhom].cnt++;
    nhomMap[nhom].chSet.add(r.sap);
  });

  const arr = Object.values(nhomMap).map(g => ({
    name: g.name, cnt: g.cnt, ch: g.chSet.size,
    pct: totalCH ? Math.round(g.chSet.size / totalCH * 100) : 0
  }));

  if (!arr.length) { $('loaiDTSection').innerHTML = '<div class="empty">Chưa có dữ liệu</div>'; return; }

  const sf = SORT_FNS[SORT_L.col] || SORT_FNS.cnt;
  arr.sort((a, b) => { const v = sf(a, b); return SORT_L.asc ? v : -v; });

  const cols = '<colgroup><col style="width:22%"><col style="width:15%"><col style="width:15%"><col style="width:16%"><col style="width:10%"></colgroup>';
  let html = '<table class="gdv-table">' + cols + '<thead><tr>';
  html += thSort('name', SORT_L, 'Nhóm ĐT')
    + thSort('cnt', SORT_L, 'Số ĐT')
    + thSort('ch', SORT_L, 'Số CH')
    + '<th class="bar-cell col-bar">Tỷ lệ CH</th>'
    + thSort('pct', SORT_L, '%');
  html += '</tr></thead><tbody>';

  arr.forEach(g => {
    html += '<tr><td class="col-gdv" style="font-weight:700">' + esc(g.name) + '</td>';
    html += '<td class="col-num">' + g.cnt + '</td>';
    html += '<td class="col-num">' + g.ch + '</td>';
    html += '<td class="bar-cell col-bar"><i style="width:' + g.pct + '%"></i></td>';
    html += '<td class="col-pct">' + g.pct + '%</td></tr>';
  });

  html += '<tr><td colspan="5" style="text-align:center;font-size:11px;color:var(--mut);padding:8px">'
    + arr.length + ' nhóm · ' + totalCH + ' CH trong scope</td></tr>';
  html += '</tbody></table>';
  $('loaiDTSection').innerHTML = html;
}

function switchTab(tab) {
  $('tabGdv').classList.toggle('active', tab === 'gdv');
  $('tabTopQlkv').classList.toggle('active', tab === 'topQlkv');
  $('tabLoaiDT').classList.toggle('active', tab === 'loaiDT');
  $('gdvSection').style.display = tab === 'gdv' ? '' : 'none';
  $('topQlkvSection').style.display = tab === 'topQlkv' ? '' : 'none';
  $('loaiDTSection').style.display = tab === 'loaiDT' ? '' : 'none';
  if (tab === 'topQlkv') buildTopQlkv();
  else if (tab === 'loaiDT') buildLoaiDT();
  else buildGdvSection();
}

let gdvOpen = {};
function toggleGdv(row, cls) {
  const rows = document.querySelectorAll('.' + cls);
  const ar = row.querySelector('.ar');
  if (gdvOpen[cls]) {
    rows.forEach(r => r.style.display = 'none');
    if (ar) ar.classList.remove('open');
  } else {
    rows.forEach(r => r.style.display = 'table-row');
    if (ar) ar.classList.add('open');
  }
  gdvOpen[cls] = !gdvOpen[cls];
}

function renderTable() {
  const sInScope = scopeStores();
  const scopeSaps = new Set(sInScope.map(s => s.sap));

  // Build store lookup
  const storeMap = {};
  sInScope.forEach(s => { storeMap[s.sap] = s; });

  // Filter rows in scope
  let list = ROWS.filter(r => scopeSaps.has(r.sap));
  const q = ($('fSearch').value || '').trim().toLowerCase();
  if (q) {
    list = list.filter(r =>
      (r.sap || '').toLowerCase().includes(q) ||
      (r.tenCH || '').toLowerCase().includes(q) ||
      (r.qlkv || '').toLowerCase().includes(q) ||
      (r.tenDT || '').toLowerCase().includes(q) ||
      (r.nhomDT || '').toLowerCase().includes(q)
    );
  }

  $('rowCount').textContent = '· ' + list.length + ' đối thủ được khai';

  // Sort by ngày update mới nhất, limit 30
  list.sort((a, b) => (b.ngayUpdate || '').localeCompare(a.ngayUpdate || ''));
  const totalCount = list.length;
  let truncated = false;
  if (!showAllDetail && totalCount > 30) {
    list = list.slice(0, 30);
    truncated = true;
  }

  let countText = '· ' + totalCount + ' đối thủ được khai';
  if (truncated) countText = '· Mới nhất 30/' + totalCount + ' đối thủ';
  $('rowCount').textContent = countText;

  if (!list.length) {
    $('tableWrap').innerHTML = '<div class="empty">Chưa có dữ liệu · ' + (CURRENT_WEEK ? ('Tuần ' + CURRENT_WEEK) : 'Tất cả') + '</div>';
    return;
  }

  // Group by CH for the table
  const bySap = {};
  list.forEach(r => {
    if (!bySap[r.sap]) bySap[r.sap] = [];
    bySap[r.sap].push(r);
  });

  const sapList = Object.keys(bySap).sort((a, b) => {
    const sa = storeMap[a], sb = storeMap[b];
    const ga = sa ? sa.gdv : '', gb = sb ? sb.gdv : '';
    return String(ga).localeCompare(String(gb), 'vi') || String(a).localeCompare(String(b));
  });

  let html = '<table><thead><tr><th>Mã CH</th><th>Tên CH</th><th>Tỉnh</th><th>GĐV</th><th>QLKV</th><th>Nhóm ĐT</th><th>Tên đối thủ</th><th>KC</th><th>Mã ĐT</th></tr></thead><tbody>';

  sapList.forEach(sap => {
    const store = storeMap[sap] || {};
    const dts = bySap[sap];
    dts.forEach((r, i) => {
      const rowClass = i === 0 ? '' : ' style="border-top:1px dashed var(--line)"';
      html += '<tr' + rowClass + '>';
      if (i === 0) {
        const rowSpan = dts.length > 1 ? ' rowspan="' + dts.length + '"' : '';
        html += '<td' + rowSpan + '><span class="store-link">' + esc(sap) + '</span></td>';
        html += '<td' + rowSpan + '>' + esc(store.ten || r.tenCH) + '</td>';
        html += '<td' + rowSpan + '>' + esc(store.tinh || r.tinh) + '</td>';
        html += '<td' + rowSpan + '>' + esc(store.gdv || r.gdv) + '</td>';
        html += '<td' + rowSpan + '>' + esc(store.qlkv || r.qlkv) + '</td>';
      }
      html += '<td>' + esc(r.nhomDT) + '</td>';
      html += '<td>' + esc(r.tenDT) + '</td>';
      html += '<td class="num">' + (r.kc ? esc(r.kc) + ' km' : '—') + '</td>';
      html += '<td>' + (r.maDT ? '<span class="tag ok">' + esc(r.maDT) + '</span>' : '—') + '</td>';
      html += '</tr>';
    });
  });
  if (truncated) {
    html += '<tr><td colspan="9" style="text-align:center;padding:12px"><button id="btnShowMore" onclick="showAllDetail=true;renderTable()" style="cursor:pointer;font-weight:600;font-size:13px;padding:8px 20px;border:2px solid var(--navy);color:var(--navy);border-radius:6px;background:white">📋 Xem thêm ' + (totalCount - 30) + ' đối thủ...</button></td></tr>';
  }
  html += '</tbody></table>';
  $('tableWrap').innerHTML = '<div class="tbl-scroll">' + html + '</div>';
}

async function refreshData() {
  $('updated').textContent = 'Đang tải...';
  STORES = []; ALL_ROWS = []; ROWS = [];
  await loadAll();
}

function exportDetail() {
  const sInScope = scopeStores();
  const scopeSaps = new Set(sInScope.map(s => s.sap));
  const storeMap = {};
  sInScope.forEach(s => { storeMap[s.sap] = s; });

  // Lấy TOÀN BỘ đối thủ trong scope (theo filter hiện tại)
  let list = ALL_ROWS.filter(r => scopeSaps.has(r.sap));

  const q = ($('fSearch').value || '').trim().toLowerCase();
  if (q) list = list.filter(r =>
    (r.sap||'').toLowerCase().includes(q) ||
    (r.tenCH||'').toLowerCase().includes(q) ||
    (r.tenDT||'').toLowerCase().includes(q) ||
    (r.nhomDT||'').toLowerCase().includes(q)
  );

  if (!list.length) { alert('Không có dữ liệu để xuất'); return; }

  // Export toàn bộ field đối thủ (theo schema mới)
  const hdr = ['Mã ĐT','Mã CH','Tên CH','Miền','GĐV','QLKV','Tỉnh/TP','Quận/Huyện','Nhóm ĐT','Tên ĐT','Địa chỉ','Vĩ độ','Kinh độ','KC (km)','Ngày KT','Doanh số','Khách','MT (m)','Giá thuê','Diện tích (m²)','Ngày khai báo','Ngày update'];
  const rows = list.map(r => {
    const s = storeMap[r.sap] || {};
    return [
      r.maDT, r.sap, s.ten||r.tenCH, s.mien||r.mien, s.gdv||r.gdv, s.qlkv||r.qlkv,
      s.tinh||r.tinh, s.huyen||r.huyen,
      r.nhomDT, r.tenDT, r.diaChi,
      r.lat, r.lng, r.kc, r.ngayKT,
      r.doanhSo, r.luongKhach, r.mt, r.giaThue, r.dienTich,
      r.ngayKhaiBao || '', r.ngayUpdate || ''
    ];
  });

  const m = $('selMien').value || 'AllMien';
  const v = $('selVung').value || 'AllGDV';
  downloadCSV('RaSoatDoiThu_' + m + '_' + v + '_' + new Date().toISOString().slice(0,10), hdr, rows);
}

function exportMissing() {
  const sInScope = scopeStores();
  const doneSaps = getDoneSapsForWeek(CURRENT_WEEK);
  [...doneSaps].forEach(sap => { if (!sInScope.some(s => s.sap === sap)) doneSaps.delete(sap); });
  const missing = sInScope.filter(s => !doneSaps.has(s.sap));

  if (!missing.length) { alert('✅ Tất cả CH đã được khảo sát trong tuần này!'); return; }

  const hdr = ['Mã SAP','Tên CH','Tỉnh/TP','Huyện','QLKV','GĐV'];
  const rows = missing.map(s => [s.sap, s.ten, s.tinh, s.huyen, s.qlkv, s.gdv]);
  downloadCSV('CH_Chua_Khao_Sat_DoiThu_Tuan' + CURRENT_WEEK + '_' + new Date().toISOString().slice(0,10), hdr, rows);
}

function downloadCSV(filename, hdr, rows) {
  const csv = '\uFEFF' + hdr.join(',') + '\n' + rows.map(r => r.map(v => '"' + (v || '').toString().replace(/"/g, '""') + '"').join(',')).join('\n');
  const blob = new Blob([csv], {type: 'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = filename + '.csv';
  a.click(); URL.revokeObjectURL(a.href);
}

// Init
loadAll();
